# Local development infrastructure only: Postgres, Redis, MinIO.
# Run the api / worker / portal from your shell with `pnpm dev`.
# For the full containerised stack use docker-compose.yml instead.

services:
  postgres:
    image: postgres:16-alpine
    container_name: uae-postgres
    environment:
      POSTGRES_USER: uae
      POSTGRES_PASSWORD: uae_dev_password
      POSTGRES_DB: uae_einvoice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uae -d uae_einvoice"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: uae-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: uae-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the archive bucket with Object Lock enabled. Object Lock can only
  # be turned on at bucket-creation time, which is why this runs as its own
  # one-shot job rather than being done lazily by the app.
  minio-init:
    image: minio/mc:latest
    container_name: uae-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc ls local/uae-einvoice-archive >/dev/null 2>&1 ||
        mc mb --with-lock local/uae-einvoice-archive) &&
      mc retention set --default COMPLIANCE 5y local/uae-einvoice-archive &&
      mc version enable local/uae-einvoice-archive &&
      echo 'archive bucket ready (COMPLIANCE lock, 5y)'
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
