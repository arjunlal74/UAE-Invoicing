server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Long-lived caching for fingerprinted assets, none for the entry document —
    # otherwise a deploy leaves users on a stale index pointing at deleted bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The API is proxied through the same origin so the browser needs no CORS
    # preflight and cookies would behave identically if introduced later.
    location /api/ {
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The audit trail records the client IP; without this every entry would
        # show the proxy's address instead.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are up to 50MB and a large workbook takes a while to accept.
        client_max_body_size 64m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Client-side routing: unknown paths are React Router's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
